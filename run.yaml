# Fill this in before you submit -- our evaluator runs these commands
# EXACTLY as written, in this order, from a fresh checkout of your fork.
# Keep every command non-interactive (no prompts) and idempotent.

setup_commands:
  - "pip install -r requirements.txt"
  - "python scripts/download_mobileclip.py"

run_commands:
  - "python src/main.py --predict data/sample/sports_clip.mp4"

test_commands:
  - "python scripts/smoke_test.py"

notes: |
  Default run: calibrated MobileCLIP-S0 zero-shot on the bundled sample clip
  (expects "Sports Competition"). Needs models/mobileclip/calibration.json
  (shipped) and mobileclip_s0.pt (downloaded in setup).

  Full Video-MME metrics (88 videos, 5 domains) are optional — see docs/README.md:
    python scripts/download_dataset.py   # ~11 GB from aintropy-ai/video-mme-sample10
    python scripts/prepare_eval.py
    python src/main.py                   # accuracy, macro-F1, per-class F1, confusion
